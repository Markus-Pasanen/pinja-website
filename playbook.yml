---
- hosts: all
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Docker
      apt:
        name: 
          - docker.io
          - docker-compose
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Create Docker Compose file
      template:
        src: docker-compose.yml.j2
        dest: /srv/docker-compose.yml

    - name: Set up NGINX as a reverse proxy
      apt:
        name: nginx
        state: present

    - name: Create NGINX configuration for the Next.js app
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/{{ domain }}
      notify:
        - Reload NGINX

    - name: Enable NGINX config
      file:
        src: /etc/nginx/sites-available/{{ domain }}
        dest: /etc/nginx/sites-enabled/{{ domain }}
        state: link

    - name: Obtain SSL certificates using Let's Encrypt
      apt:
        name: certbot
        state: present
      notify:
        - Reload NGINX

    - name: Run certbot to get SSL certificates
      command: certbot --nginx -d {{ domain }} --non-interactive --agree-tos --email {{ email }}
      args:
        creates: /etc/letsencrypt/live/{{ domain }}

    - name: Bring up Docker containers
      command: docker-compose -f /srv/docker-compose.yml up -d
      args:
        chdir: /srv

  handlers:
    - name: Reload NGINX
      service:
        name: nginx
        state: reloaded
