<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/dark.css">
  <link href="https://fonts.googleapis.com/css?family=Fira+Mono:400,500,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace', 'Droid Sans Mono', 'Inconsolata', 'Courier New', Courier, monospace;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .sidebar, .sidebar ul {
      background: #23272e !important;
      text-align: left !important;
    }
    .sidebar ul li a {
      color: #d4d4d4 !important;
      text-align: left !important;
    }
    .sidebar ul li.active > a {
      color: #569cd6 !important;
    }
    a {
      color: #569cd6;
    }
    code, pre {
      font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace', 'Droid Sans Mono', 'Inconsolata', 'Courier New', Courier, monospace;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .content {
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #d4d4d4;
      font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace', 'Droid Sans Mono', 'Inconsolata', 'Courier New', Courier, monospace;
    }
    ::selection {
      background: #264f78;
      color: #fff;
    }
    /* Hide burger menu */
    .sidebar-toggle {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Project documentation',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
</body>
</html>
