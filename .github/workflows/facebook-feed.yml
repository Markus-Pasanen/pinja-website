name: Update Facebook feed

on:
  schedule:
    # Every day at 05:17 UTC (07:17/08:17 in Finland)
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Facebook posts
        env:
          FACEBOOK_RSS_URL: https://rss.app/feeds/ccdznoabxNawUrUP.xml
        run: node scripts/fetch-facebook-posts.mjs

      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/facebook-posts.json public/images/facebook

          if git diff --staged --quiet; then
            echo "No Facebook feed changes to commit."
          else
            git commit -m "chore: update Facebook feed"
            git push
          fi
